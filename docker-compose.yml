# Brings up the target app and the ZAP daemon on one network.
# The Selenium browser runs on the host and proxies through ZAP (published on localhost:8080);
# ZAP reaches the target by its service name, so the target URL is http://juice-shop:3000.
#
# Tags are the moving "stable"/"latest"; pin to a specific version (e.g. bkimminich/juice-shop:v17.1.1,
# ghcr.io/zaproxy/zaproxy:2.16.1) for reproducible runs.
services:
  juice-shop:
    image: bkimminich/juice-shop:latest
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/rest/admin/application-version"]
      interval: 5s
      timeout: 3s
      retries: 40

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8080
      -config api.disablekey=true
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    ports:
      - "8080:8080"
    depends_on:
      juice-shop:
        condition: service_healthy
