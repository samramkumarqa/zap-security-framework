# Defaults only. Override any key with -Dkey=value or an environment variable (target.url -> TARGET_URL).

# The application under test. Must be an app you are authorised to scan.
# Local ZAP + local Juice Shop:        http://localhost:3000
# docker compose (see docker-compose.yml): passed in as http://juice-shop:3000
target.url=http://localhost:3000

# ZAP daemon the suite talks to
zap.host=localhost
zap.port=8080
# API key: set ZAP_API_KEY in the environment, or disable the key on a throwaway local daemon. Never commit a real key.
# zap.api.key=

# Build gate: fail if any alert is at or above this risk (INFORMATIONAL, LOW, MEDIUM, HIGH)
fail.on.risk=HIGH
# Cap on the active scan so a run can't hang forever
ascan.timeout.minutes=20

# Browser
headless=true
timeout.seconds=10

# Juice Shop's documented demo account, used to exercise authenticated endpoints.
# For a real app these would be environment variables / CI secrets, never checked in.
app.user.email=admin@juice-sh.op
app.user.password=admin123
